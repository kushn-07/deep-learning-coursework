data:
  batch_size: 16
  celeba_path: data/processed/celeba_small
  image_size: 256
  num_workers: 2
  train_split: 0.95
  wikiart_path: data/processed/wikiart_small
model:
  discriminator:
    base_channels: 64
    num_layers: 3
  generator:
    base_channels: 64
    num_downsampling: 4
    num_residual_blocks: 6
    use_adain: true
  style_encoder:
    base_channels: 32
    style_dim: 256
  text_encoder:
    embed_dim: 512
project:
  description: Small dataset for Colab training
  name: msc-face-stylization-small
training:
  beta1: 0.5
  beta2: 0.999
  epochs: 10
  log_interval: 100
  loss_weights:
    adversarial: 1.0
    clip: 2.0
    identity: 10.0
    perceptual: 5.0
    style: 3.0
  lr_d: 0.0002
  lr_g: 0.0002
  save_interval: 5
